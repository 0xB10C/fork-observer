name: Rust

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose --all-features
    - name: Run tests
      run: cargo test --verbose --all-features
    - name: Run cargo fmt
      run: cargo fmt --all -- --check

  lint:

    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
    - name: Run cargo clippy
      run: cargo clippy --verbose --all-targets --all-features

  # Mutation testing (see the README) of the code a pull request changes: every
  # mutant cargo-mutants generates there has to make a test fail.
  mutants:

    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Diff against the base branch
      run: git diff origin/${{ github.base_ref }}...HEAD > /tmp/diff.patch
    - uses: taiki-e/install-action@cargo-mutants
    - name: Run cargo mutants on the changed code
      run: cargo mutants --in-diff /tmp/diff.patch
