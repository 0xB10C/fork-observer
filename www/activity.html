<!DOCTYPE html>
<html>

<head>
  <meta name="color-scheme" content="dark light">
  <meta charset="utf-8">
  <title>fork-observer - activity</title>
  <meta name="author" content="">
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="static/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor">
  <link href="static/css/style.css" rel="stylesheet">
</head>

<body>
  <div class="container-fluid app-shell">
    <header class="app-header">
      <nav class="navbar py-2">
        <a class="navbar-brand d-flex align-items-center gap-2 m-0" href=".">
          <img src="static/img/logo.svg" width="30" height="30" class="d-inline-block align-top invert" alt="">
          <span class="fw-semibold">fork-observer</span>
        </a>
        <div class="d-flex align-items-center gap-3">
          <label class="d-flex align-items-center gap-2 m-0">
            <span class="small text-muted-soft">Network</span>
            <select name="network" id="network" class="form-select form-select-sm"></select>
          </label>
          <label class="d-flex align-items-center gap-1 m-0" title="Connection status">
            <span class="small text-muted-soft">Connection</span>
            <span id="connection-status" style="color: gray">█</span>
          </label>
        </div>
      </nav>
    </header>
    <main class="flex-grow-1">
      <div class="toolbar">
        <div class="toolbar-info">
          <h1 class="h3 mb-1">Activity log</h1>
          <p class="text-muted-soft mb-0" id="activity-subtitle">What the nodes of this network reported, newest first.</p>
        </div>
        <div class="toolbar-controls">
          <label class="d-flex align-items-center gap-2 m-0" title="Refresh when a node reports something new">
            <span class="small text-muted-soft">live</span>
            <input type="checkbox" id="live" class="form-check-input m-0" checked>
          </label>
          <input type="search" id="search" class="form-control form-control-sm activity-search" placeholder="filter by hash, height, …">
        </div>
      </div>

      <div class="filter-bar">
        <div class="filter-group">
          <span class="filter-label">event</span>
          <div class="filter-pills" id="kind-filters"></div>
        </div>
        <div class="filter-group">
          <span class="filter-label">node</span>
          <div class="filter-pills" id="node-filters"></div>
        </div>
      </div>

      <div class="activity-status text-muted-soft small" id="activity-status"></div>
      <div class="activity-list" id="activity-list"></div>
      <div class="activity-more">
        <button type="button" class="btn-plain" id="load-older">load older events</button>
        <span class="text-muted-soft small" id="load-older-note"></span>
      </div>
    </main>
    <footer class="app-footer mt-4">
      <div class="row text-center align-items-center">
        <div class="col-lg-6 p-3">
          <a target="_blank" rel="noopener" href="https://github.com/0xb10c/fork-observer" class="footer-link">
            <img src="static/img/GitHub-Mark-64px.png" class="invert" width=24 height=24 alt="GitHub logo">
            <span>fork-observer</span>
          </a>
          <span class="text-muted-soft small d-block">Issues, Feature Ideas, and Self-Hosting Instructions</span>
        </div>
        <div class="col-lg-6 p-3">
          <span class="text-muted-soft" id="footer-custom"></span>
        </div>
      </div>
    </footer>
  </div>
  <div id="toast" class="toast-msg"></div>
</body>

<script src="static/js/activity-events.js"></script>
<script src="static/js/activity.js"></script>
</html>
